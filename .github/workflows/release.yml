name: Build and publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        shell: pwsh
        run: |
          git fetch origin main --tags
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main.' }
          git reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not sync with main.' }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read exact project version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        run: npm run dist
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Create release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure git author.' }
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure git email.' }
          git tag -a "v${{ steps.version.outputs.version }}" -m "Vexlor Control Center v${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the release tag.' }
          git push origin "refs/tags/v${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push the release tag.' }

      - name: Deutsche GitHub-Veröffentlichung erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceCommit = '${{ github.sha }}'
          $previousTag = git describe --tags --abbrev=0 $sourceCommit
          if ($LASTEXITCODE -ne 0) { throw 'Das vorherige Versionskennzeichen konnte nicht ermittelt werden.' }
          $changes = git log --no-merges --format='- %s' "$previousTag..$sourceCommit"
          if ($LASTEXITCODE -ne 0) { throw 'Die Änderungen für die Versionshinweise konnten nicht ermittelt werden.' }
          if (-not $changes) { $changes = '- Fehlerbehebungen und Verbesserungen' }
          $notes = "Änderungen in Version ${{ steps.version.outputs.version }}:`n`n$changes"
          gh release create "v${{ steps.version.outputs.version }}" "release/Vexlor-Control-Center-${{ steps.version.outputs.version }}-x64.exe" --verify-tag --title "Vexlor Control Center ${{ steps.version.outputs.version }}" --notes "$notes"
          if ($LASTEXITCODE -ne 0) { throw 'Die GitHub-Veröffentlichung ist fehlgeschlagen.' }
