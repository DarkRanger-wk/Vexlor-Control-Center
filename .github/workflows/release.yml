name: Build and publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        shell: pwsh
        run: |
          git fetch origin main --tags
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main.' }
          git reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not sync with main.' }

      - name: Read exact project version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check whether this version is already released
        id: release-status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $releases = gh release list --limit 1000 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list existing releases.' }
          if ($releases.tagName -contains $tag) {
            "should_publish=false" >> $env:GITHUB_OUTPUT
            $subject = git log -1 --format='%s' $env:GITHUB_SHA
            if ($subject -like 'changelog:*') {
              "update_notes=true" >> $env:GITHUB_OUTPUT
              Write-Host "Release $tag already exists; its German notes will be updated."
            } else {
              "update_notes=false" >> $env:GITHUB_OUTPUT
              Write-Host "Release $tag already exists; skipping publication."
            }
          } else {
            "should_publish=true" >> $env:GITHUB_OUTPUT
            "update_notes=false" >> $env:GITHUB_OUTPUT
          }

      - name: Set up Node.js
        if: steps.release-status.outputs.should_publish == 'true' || steps.release-status.outputs.update_notes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.release-status.outputs.should_publish == 'true'
        run: npm ci

      - name: Build Windows installer
        if: steps.release-status.outputs.should_publish == 'true'
        run: npm run dist
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deutsche Versionshinweise erstellen oder aktualisieren
        if: steps.release-status.outputs.should_publish == 'true' || steps.release-status.outputs.update_notes == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceCommit = '${{ github.sha }}'
          $tag = "v${{ steps.version.outputs.version }}"
          $previousTag = git tag --list 'v*' --sort=-version:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1
          if (-not $previousTag) { throw 'Das vorherige Versionskennzeichen konnte nicht ermittelt werden.' }
          $subjects = @(git log --no-merges --format='%s' "$previousTag..$sourceCommit" | Where-Object { $_ -notmatch '^changelog:' })
          if ($LASTEXITCODE -ne 0) { throw 'Die Änderungen für die Versionshinweise konnten nicht ermittelt werden.' }
          $arguments = @('scripts/german-release-notes.mjs', '${{ steps.version.outputs.version }}') + $subjects
          $notes = (& node @arguments | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Die deutschen Versionshinweise konnten nicht erstellt werden.' }
          if ('${{ steps.release-status.outputs.should_publish }}' -eq 'true') {
            gh release create "$tag" "release/Vexlor-Control-Center-${{ steps.version.outputs.version }}-x64.exe" --target "$sourceCommit" --title "Vexlor Control Center ${{ steps.version.outputs.version }}" --notes "$notes"
            if ($LASTEXITCODE -ne 0) { throw 'Die GitHub-Veröffentlichung ist fehlgeschlagen.' }
          } else {
            gh release edit "$tag" --notes "$notes"
            if ($LASTEXITCODE -ne 0) { throw 'Die deutschen Versionshinweise konnten nicht aktualisiert werden.' }
          }
